<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>시험 3 — 웹 화면에서 Google 쪽 배치 호출 (임시)</title>
<style>body{font-family:'Malgun Gothic',sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#1a202c}
button{padding:10px 16px;margin:4px 6px 4px 0;border:1px solid #94a3b8;border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
button.pri{background:#2563EB;color:#fff;border-color:#2563EB}
input{width:100%;padding:8px;box-sizing:border-box;margin:4px 0 10px}
pre{background:#0f172a;color:#e2e8f0;padding:12px;border-radius:8px;white-space:pre-wrap;min-height:120px}
.note{font-size:13px;color:#475569}</style></head><body>
<h2>시험 3 — 웹 화면에서 Google 쪽 배치 호출 (임시 파일)</h2>
<p class="note">New 폴더의 파일 "개수"만 세는 읽기 전용 시험입니다. 시트·파일은 건드리지 않습니다. 시험 후 이 파일과 Apps Script 배포를 삭제합니다.</p>
<label for="u">Apps Script 웹 앱 주소 (/exec 로 끝나는 주소)</label>
<input id="u" type="text" placeholder="https://script.google.com/macros/s/.../exec">
<button id="b1">1. 로그인</button><button id="b2">2. 연결 확인(ping)</button><button class="pri" id="b3">3. 실행 + 진행 상태 보기</button><button id="b4">결과 복사</button>
<pre id="log"></pre>
<script src="js/schema.js"></script><script src="js/common.js"></script>
<script>
let pendingAuth=null; const L=document.getElementById('log'); const out=[];
function log(m){out.push(m);L.textContent=out.join('\n');}
function toast(){}
async function call(body){
  const url=document.getElementById('u').value.trim();
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({token:accessToken},body))});
  return await r.json();
}
document.getElementById('b1').onclick=async()=>{const ok=await signIn();log(ok?'[통과] 로그인':'[실패] 로그인');};
document.getElementById('b2').onclick=async()=>{
  try{const t=Date.now();const r=await call({action:'ping'});log((r.ok?'[통과]':'[실패]')+' ping '+JSON.stringify(r)+' ('+(Date.now()-t)+'ms)');}
  catch(e){log('[실패] 호출 오류: '+e.message+' (주소·배포 접근 권한 확인)');}
};
document.getElementById('b3').onclick=async()=>{
  const id='t'+Date.now();log('실행 시작 '+id);
  let done=false;
  const poll=setInterval(async()=>{ if(done)return; try{const s=await call({action:'status',jobId:id});log('  상태: '+s.status);}catch(e){log('  상태 조회 오류 '+e.message);} },1500);
  try{const t=Date.now();const r=await call({action:'run',jobId:id});done=true;clearInterval(poll);
    log((r.ok?'[통과]':'[실패]')+' 실행 결과 '+JSON.stringify(r)+' ('+Math.round((Date.now()-t)/1000)+'초)');}
  catch(e){done=true;clearInterval(poll);log('[실패] 실행 오류: '+e.message);}
};
document.getElementById('b4').onclick=()=>{navigator.clipboard.writeText(out.join('\n'));log('복사됨');};
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initOAuth()"></script>
</body></html>
