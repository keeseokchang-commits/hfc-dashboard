<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>0단계 시험 (임시)</title>
<style>
body{font-family:system-ui,'Malgun Gothic',sans-serif;max-width:860px;margin:20px auto;padding:0 14px;color:#1A202C}
h1{font-size:20px} button{padding:9px 14px;margin:4px 6px 4px 0;border:1px solid #CBD5E0;border-radius:8px;background:#fff;cursor:pointer;font-size:14px}
button.primary{background:#2B6CB0;color:#fff;border-color:#2B6CB0} button.warn{color:#C53030;border-color:#C53030}
#log{white-space:pre-wrap;background:#F7FAFC;border:1px solid #E2E8F0;border-radius:8px;padding:12px;font-size:13px;min-height:160px}
.ok{color:#2F855A}.ng{color:#C53030}.note{color:#718096;font-size:13px}
</style>
</head>
<body>
<h1>0단계 시험 (임시 페이지)</h1>
<p class="note">시트에는 ZZ_TEST 탭 하나만 만들고 씁니다. 기존 탭은 읽지도 쓰지도 않습니다. 시험이 끝나면 아래 "ZZ_TEST 탭 삭제"를 누르거나 시트에서 직접 지우세요. 이 파일은 시험 후 저장소에서 삭제합니다.</p>
<div>
  <button class="primary" onclick="doLogin()">1. Google 로그인</button>
  <button class="primary" onclick="runAll()">2. 시험 실행 (전체)</button>
  <button onclick="copyLog()">결과 복사</button>
  <button class="warn" onclick="dropTab()">ZZ_TEST 탭 삭제</button>
</div>
<div id="log">로그인 후 "시험 실행"을 누르세요.</div>
<div id="toast" style="position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#1A202C;color:#fff;padding:8px 14px;border-radius:8px;opacity:0;transition:opacity .2s"></div>
<style>#toast.show{opacity:1}</style>
<script src="js/schema.js"></script>
<script src="js/common.js"></script>
<script>
const TAB='ZZ_TEST';
const BASE=`https://sheets.googleapis.com/v4/spreadsheets/${SHEETS_ID}`;
let pendingAuth=null, tabId=null;
const logEl=document.getElementById('log');
function L(msg,cls){ const s=document.createElement('span'); if(cls)s.className=cls; s.textContent=msg+'\n'; logEl.appendChild(s); }
function PASS(name,detail){ L('[통과] '+name+(detail?' — '+detail:''),'ok'); }
function FAIL(name,detail){ L('[실패] '+name+(detail?' — '+detail:''),'ng'); }
function H(){ return {Authorization:'Bearer '+accessToken,'Content-Type':'application/json'}; }
async function api(url,opt){ const r=await fetch(url,opt); let b=null; try{b=await r.json();}catch(e){} return {ok:r.ok,status:r.status,body:b}; }
async function doLogin(){ if(!tokenClient){ L('로그인 모듈 준비 중입니다. 잠시 후 다시 누르세요.','ng'); return; } const ok=await signIn(); L(ok?'로그인 완료':'로그인 실패', ok?'ok':'ng'); }
async function getTabId(){
  const r=await api(`${BASE}?fields=sheets.properties`,{headers:H()});
  if(!r.ok) return null;
  const s=(r.body.sheets||[]).find(x=>x.properties.title===TAB); return s?s.properties.sheetId:null;
}
async function runAll(){
  logEl.textContent='';
  if(!accessToken){ L('먼저 로그인하세요.','ng'); return; }
  L('시작: '+new Date().toLocaleString('ko-KR')+'\n');
  const T0=Date.now();
  // ── 시험 2: 탭 생성 + 서식/검증/헤더 고정 ─────────────────────
  L('■ 시험 2. 탭 생성과 서식·검증');
  try{
    tabId=await getTabId();
    if(tabId===null){
      const r=await api(`${BASE}:batchUpdate`,{method:'POST',headers:H(),body:JSON.stringify({requests:[{addSheet:{properties:{title:TAB,gridProperties:{rowCount:50,columnCount:6,frozenRowCount:1}}}}]})});
      if(!r.ok){ FAIL('탭 생성','HTTP '+r.status+' '+JSON.stringify(r.body).slice(0,200)); return; }
      tabId=r.body.replies[0].addSheet.properties.sheetId;
      PASS('탭 생성','sheetId='+tabId);
    } else { PASS('탭 이미 있음','sheetId='+tabId); }
    const fmt=(c0,c1)=>({repeatCell:{range:{sheetId:tabId,startColumnIndex:c0,endColumnIndex:c1,startRowIndex:1},cell:{userEnteredFormat:{numberFormat:{type:'TEXT'}}},fields:'userEnteredFormat.numberFormat'}});
    const reqs=[
      fmt(0,3),
      {setDataValidation:{range:{sheetId:tabId,startRowIndex:1,startColumnIndex:3,endColumnIndex:4},rule:{condition:{type:'ONE_OF_LIST',values:[{userEnteredValue:'Y'},{userEnteredValue:'N'}]},strict:true,showCustomUi:true}}},
      {updateSheetProperties:{properties:{sheetId:tabId,gridProperties:{frozenRowCount:1}},fields:'gridProperties.frozenRowCount'}}
    ];
    const r2=await api(`${BASE}:batchUpdate`,{method:'POST',headers:H(),body:JSON.stringify({requests:reqs})});
    r2.ok?PASS('열 서식(텍스트)·드롭다운 검증·헤더 고정 적용'):FAIL('서식/검증 적용','HTTP '+r2.status+' '+JSON.stringify(r2.body).slice(0,200));
    const hdr=await api(`${BASE}/values/${encodeURIComponent(TAB+'!A1:E1')}?valueInputOption=RAW`,{method:'PUT',headers:H(),body:JSON.stringify({values:[['id','ym','phone','yn','updated_at']]})});
    hdr.ok?PASS('헤더 기록'):FAIL('헤더 기록','HTTP '+hdr.status);
  }catch(e){ FAIL('탭 생성 단계 예외',e.message); return; }
  // ── 시험 1: 행 단위 추가/수정/삭제 ───────────────────────────
  L('\n■ 시험 1. 행 단위 추가·수정·삭제');
  let rowNo=null;
  try{
    // 추가 (RAW: 선행 0, 연-월 문자열 보존 확인)
    const ap=await api(`${BASE}/values/${encodeURIComponent(TAB+'!A:E')}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{method:'POST',headers:H(),body:JSON.stringify({values:[['PSN-0001','2026-07','0001011','Y','2026-10-10']]})});
    if(!ap.ok){ FAIL('행 추가(append)','HTTP '+ap.status+' '+JSON.stringify(ap.body).slice(0,200)); }
    else{
      const rng=ap.body.updates.updatedRange; rowNo=parseInt(rng.match(/!A(\d+)/)[1]);
      PASS('행 추가(append)', rng);
    }
    // 다시 읽어 값 보존 확인 (API 키 읽기 = 기존 화면과 같은 경로)
    const rd=await api(`${BASE}/values/${encodeURIComponent(TAB+'!A'+rowNo+':E'+rowNo)}?key=${API_KEY}`);
    if(rd.ok && rd.body.values){
      const v=rd.body.values[0];
      (v[0]==='PSN-0001'&&v[1]==='2026-07'&&v[2]==='0001011')?PASS('값 보존(ID·연-월·선행 0)', JSON.stringify(v)):FAIL('값 보존', JSON.stringify(v));
    } else FAIL('API 키로 새 탭 읽기','HTTP '+rd.status+' (기존 화면이 쓰는 읽기 방식으로 새 탭을 못 읽음)');
    // 수정
    const up=await api(`${BASE}/values/${encodeURIComponent(TAB+'!A'+rowNo+':E'+rowNo)}?valueInputOption=RAW`,{method:'PUT',headers:H(),body:JSON.stringify({values:[['PSN-0001','2026-08','0001011','N','2026-10-11']]})});
    up.ok?PASS('행 수정(update)'):FAIL('행 수정(update)','HTTP '+up.status);
    const rd2=await api(`${BASE}/values/${encodeURIComponent(TAB+'!A'+rowNo+':E'+rowNo)}?key=${API_KEY}`);
    (rd2.ok&&rd2.body.values&&rd2.body.values[0][1]==='2026-08')?PASS('수정 반영 확인'):FAIL('수정 반영 확인',JSON.stringify(rd2.body).slice(0,150));
    // 동시 수정 확인용: updated_at 비교 (수정 전 값 2026-10-10 ≠ 현재 2026-10-11)
    (rd2.ok&&rd2.body.values[0][4]==='2026-10-11')?PASS('updated_at 비교 가능(충돌 확인용)'):FAIL('updated_at 비교');
    // 두 번째 행 추가 후 첫 행 삭제 → 아래 행이 올라오는지
    const ap2=await api(`${BASE}/values/${encodeURIComponent(TAB+'!A:E')}:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`,{method:'POST',headers:H(),body:JSON.stringify({values:[['PSN-0002','2026-09','0102030','Y','2026-10-10']]})});
    ap2.ok?PASS('두 번째 행 추가'):FAIL('두 번째 행 추가','HTTP '+ap2.status);
    // 삭제 (행 삭제)
    const del=await api(`${BASE}:batchUpdate`,{method:'POST',headers:H(),body:JSON.stringify({requests:[{deleteDimension:{range:{sheetId:tabId,dimension:'ROWS',startIndex:rowNo-1,endIndex:rowNo}}}]})});
    del.ok?PASS('행 삭제(deleteDimension)'):FAIL('행 삭제','HTTP '+del.status+' '+JSON.stringify(del.body).slice(0,200));
    const all=await api(`${BASE}/values/${encodeURIComponent(TAB+'!A1:E20')}?key=${API_KEY}`);
    const ids=(all.body.values||[]).map(r=>r[0]);
    (!ids.includes('PSN-0001')&&ids.includes('PSN-0002'))?PASS('삭제 결과 확인(PSN-0001 없음, PSN-0002 유지)', ids.join(',')):FAIL('삭제 결과 확인', ids.join(','));
  }catch(e){ FAIL('행 단위 시험 예외',e.message); }
  // ── 서식·검증이 실제로 시트에 걸렸는지 확인 ─────────────────
  L('\n■ 서식·검증 적용 확인');
  try{
    const g=await api(`${BASE}?ranges=${encodeURIComponent(TAB+'!A3:D3')}&fields=sheets.data.rowData.values(userEnteredFormat.numberFormat,dataValidation)&includeGridData=true`,{headers:H()});
    const row=g.body&&g.body.sheets&&g.body.sheets[0].data[0].rowData;
    if(row&&row[0]&&row[0].values){
      const v=row[0].values;
      (v[2]&&v[2].userEnteredFormat&&v[2].userEnteredFormat.numberFormat&&v[2].userEnteredFormat.numberFormat.type==='TEXT')?PASS('열 서식 TEXT 적용 확인(삭제 후에도 유지)'):FAIL('열 서식 확인',JSON.stringify(v[2]).slice(0,120));
      (v[3]&&v[3].dataValidation)?PASS('드롭다운 검증 적용 확인'):FAIL('드롭다운 검증 확인');
    } else FAIL('서식·검증 조회','응답 없음 '+JSON.stringify(g.body).slice(0,150));
  }catch(e){ FAIL('서식 확인 예외',e.message); }
  // ── 로그인 상태에서 연속 호출 속도 ───────────────────────────
  L('\n■ 참고');
  L('총 소요: '+((Date.now()-T0)/1000).toFixed(1)+'초');
  L('\n※ 시험 3(웹 화면에서 이력서 등록 배치 실행)과 시험 4(실제 이력서 읽기 품질)는 이 페이지로 시험할 수 없습니다. 별도로 진행합니다.');
  L('\n끝. "결과 복사"를 눌러 대화에 붙여 넣어 주세요.');
}
async function dropTab(){
  if(!accessToken){ L('먼저 로그인하세요.','ng'); return; }
  const id=await getTabId(); if(id===null){ L('ZZ_TEST 탭이 없습니다.'); return; }
  if(!confirm('ZZ_TEST 탭을 삭제합니다. 시험용 탭입니다. 계속할까요?')) return;
  const r=await api(`${BASE}:batchUpdate`,{method:'POST',headers:H(),body:JSON.stringify({requests:[{deleteSheet:{sheetId:id}}]})});
  L(r.ok?'ZZ_TEST 탭 삭제 완료':'삭제 실패 HTTP '+r.status, r.ok?'ok':'ng');
}
function copyLog(){ navigator.clipboard.writeText(logEl.textContent).then(()=>toast('복사됨'),()=>toast('복사 실패',true)); }
</script>
<script src="https://accounts.google.com/gsi/client" async defer onload="initOAuth()"></script>
</body>
</html>
