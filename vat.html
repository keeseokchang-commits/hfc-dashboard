<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>HFC 부가세 관리</title>
<link rel="stylesheet" href="css/common.css?v=3.10.2">
<style>
  @media(max-width:480px){#declBox .fr{grid-template-columns:1fr}}
  #declBox .fi{height:38px;box-sizing:border-box}
  #declBox .fl{white-space:normal}

  :root{--bg:#F2F4F7;--surface:#FFFFFF;--surface2:#F7F9FC;--border:#E2E8F0;--text:#1A202C;--text2:#4A5568;--text3:#A0AEC0;--blue:#2563EB;--blue-lt:#EBF4FF;--green:#059669;--green-lt:#ECFDF5;--amber:#D97706;--amber-lt:#FFFBEB;--red:#DC2626;--red-lt:#FEF2F2;--nav-h:56px;--radius:12px;--shadow:0 1px 4px rgba(0,0,0,.08)}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100dvh}
  .app-header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);height:52px;display:flex;align-items:center;padding:0 16px;gap:10px}
  .app-logo{font-weight:700;font-size:15px;color:var(--blue);flex:1}
  .app-logo span{color:var(--text3);font-weight:400;font-size:13px;margin-left:4px}
  .btn-icon{width:36px;height:36px;border-radius:8px;border:none;background:var(--surface2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text2)}
  .main{padding:14px 14px 80px}
  .card{background:var(--surface);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);border:1px solid var(--border);margin-bottom:12px}
  .card-title{font-size:13px;font-weight:600;color:var(--text2);margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
  .q-card{border:1px solid var(--border);border-radius:10px;padding:14px;margin-bottom:10px;cursor:pointer;transition:all .15s}
  .q-card:hover{border-color:var(--blue)}
  .q-card.sel{border-color:var(--blue);background:var(--blue-lt)}
  .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
  .q-name{font-size:14px;font-weight:700}
  .q-due{font-size:11px;color:var(--text3)}
  .badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:5px}
  .b-wait{background:var(--amber-lt);color:var(--amber)}
  .b-done{background:var(--green-lt);color:var(--green)}
  .b-calc{background:#F1F5F9;color:#64748B}
  .q-nums{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;font-size:11px}
  .q-nums .lbl{color:var(--text3);margin-bottom:2px}
  .q-nums .val{font-weight:700;font-size:13px}
  .q-nums .val.pay{color:var(--red)}
  .detail-table{width:100%;border-collapse:collapse;font-size:12px}
  .detail-table th{font-size:11px;color:var(--text3);text-align:right;padding:6px;border-bottom:2px solid var(--border)}
  .detail-table th:first-child,.detail-table td:first-child{text-align:left}
  .detail-table td{padding:7px 6px;border-bottom:1px solid var(--border);text-align:right}
  .detail-table tr.sum td{font-weight:700;color:var(--blue);border-bottom:none}
  .fi{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;outline:none}
  .fi:focus{border-color:var(--blue)}
  .fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
  .fl{font-size:11px;color:var(--text3);display:block;margin-bottom:4px}
  .btn{padding:11px 18px;border-radius:8px;font-size:13px;font-weight:500;cursor:pointer;border:none;flex:1}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:disabled{background:var(--text3)}
  .btn-green{background:var(--green);color:#fff}
  .btn-row{display:flex;gap:8px;margin-top:12px}
  .pay-formula{background:var(--amber-lt);border:1px solid #FDE68A;border-radius:8px;padding:12px;font-size:13px;color:#92400E;margin-bottom:12px;line-height:1.6}
  .toast{position:fixed;bottom:70px;left:50%;transform:translateX(-50%) translateY(20px);background:#1A202C;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;opacity:0;transition:all .25s;pointer-events:none;z-index:500;white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .loading-wrap{display:flex;align-items:center;justify-content:center;gap:10px;padding:24px;color:var(--text3);font-size:13px}
  .spinner{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--blue);border-radius:50%;animation:spin .7s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .tab-bar{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}
  .tab-item{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10px;color:var(--text3);cursor:pointer;border:none;background:none;padding:4px 0}
  .tab-item.active{color:var(--blue)}.tab-item .tab-icon{font-size:20px}
  @media(min-width:768px){
    body{display:grid;grid-template-columns:220px 1fr}
    .app-header{grid-column:1/-1}
    .side-nav{background:var(--surface);border-right:1px solid var(--border);padding:20px 12px;display:flex;flex-direction:column;gap:4px;height:calc(100dvh - 52px);position:sticky;top:52px}
    .side-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;font-size:14px;color:var(--text2);border:none;background:none;width:100%;text-align:left}
    .side-nav-item.active{background:var(--blue-lt);color:var(--blue);font-weight:600}
    .side-nav-item .sn-icon{font-size:18px}
    .tab-bar{display:none}
    .main{max-width:760px;padding:20px 24px 24px}
  }
  @media(max-width:767px){.side-nav{display:none}}
</style>

<body data-page="vat">
<header class="app-header">
  <div class="app-logo">HFC 경영관리 <span>부가세 관리</span></div>
  <button class="btn-icon" onclick="location.href='cashflow.html'">💵</button>
  <button class="btn-icon" onclick="location.href='index.html'">🏠</button>
</header>

<main class="main">
  <div class="card">
    <div class="card-title"><span style="display:inline-flex;align-items:center;gap:6px"><select id="vatYearSel" onchange="setVatYear(this.value)" style="font-size:13px;height:30px;padding:0 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)"></select><span>년 분기별 부가세</span></span> <span style="font-size:11px;color:var(--text3)">재무 반영: 수주·계약·종료 프로젝트</span></div>
    <div id="qList"><div class="loading-wrap"><div class="spinner"></div></div></div>
  </div>

  <div class="card" id="detailCard" style="display:none">
    <div class="card-title" id="detailTitle"></div>
    <div class="pay-formula" id="payFormula"></div>
    <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px">매출 부가세 내역</div>
    <table class="detail-table" id="salesTable"></table>
    <div style="font-size:12px;font-weight:600;color:var(--text2);margin:14px 0 6px">매입 부가세 내역</div>
    <table class="detail-table" id="purchaseTable"></table>
    <div id="declBox" style="margin-top:16px;padding:12px;border:1px solid var(--border);border-radius:10px;background:var(--surface)">
      <div style="font-size:12px;font-weight:600;color:var(--text2);margin-bottom:8px">신고서 입력 <span style="font-weight:400;color:var(--text3)">(홈택스 신고서 기준)</span></div>
      <div class="fr">
        <div id="dFilingWrap"><label class="fl">신고 방식 (예정)</label><select class="fi" id="dFiling"><option value="신고">직접 신고</option><option value="고지">예정고지(세무서 고지)</option></select></div>
        <div><label class="fl">그 밖의 공제매입세액 (원)</label><input class="fi" id="dOther" inputmode="numeric" oninput="this.value=comma(this.value)"></div>
        <div id="dCarryWrap"><label class="fl">예정 미환급·기납부 차감 (원)</label><input class="fi" id="dCarry" inputmode="numeric" oninput="this.value=comma(this.value)"></div>
        <div><label class="fl">신고서 최종 납부세액 (원, 환급은 − 로 입력)</label><input class="fi" id="dDeclared" inputmode="numeric" oninput="fmtSigned(this)"></div>
      </div>
      <div style="font-size:11px;color:var(--text3);margin-bottom:8px">그 밖의 공제매입세액은 신고서 (15)번 금액(카드·현금영수증 등)입니다. 예정고지는 7~9월 실적을 신고하지 않고 고지액만 내는 방식이며, 확정에서 반기 전체를 신고하고 이미 낸 고지액을 차감합니다. 비워 두면 자동 계산합니다.</div>
      <div class="btn-row"><button class="btn btn-primary" id="btnSaveDecl" onclick="saveDecl()">신고서 입력 저장</button></div>
    </div>
    <div style="margin-top:16px">
      <div class="fr">
        <div><label class="fl">실납부액 (원)</label><input class="fi" id="actualPay" inputmode="numeric" oninput="this.value=comma(this.value)"></div>
        <div><label class="fl">납부일</label><input class="fi" id="paidDate" type="date"></div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" id="btnSavePay" onclick="savePayment()">실납부 저장</button>
        <button class="btn btn-green" id="btnReflect" onclick="reflectCashflow()">자금수지 반영</button>
      </div>
    </div>
  </div>
</main>

<script src="js/schema.js?v=3.10.2"></script>
<script src="js/common.js?v=3.10.2"></script>
<script src="js/auth.js?v=3.10.2"></script>
<script src="js/calc.js?v=3.10.2"></script>
<script src="js/nav.js?v=3.10.2"></script>
<script>
let vats=[],revs=[],costs=[],fixedTax=[],prjMap={},selQ=null;
let vatYear=Number(kstToday().slice(0,4));
function buildQ(y){
  const n=y+1;
  return {'1P':{name:'1기 예정',months:[y+'-01',y+'-02',y+'-03'],due:y+'-04-25',payYm:y+'-04'},
  '1F':{name:'1기 확정',months:[y+'-04',y+'-05',y+'-06'],due:y+'-07-25',payYm:y+'-07'},
  '2P':{name:'2기 예정',months:[y+'-07',y+'-08',y+'-09'],due:y+'-10-25',payYm:y+'-10'},
  '2F':{name:'2기 확정',months:[y+'-10',y+'-11',y+'-12'],due:n+'-01-25',payYm:n+'-01'}};
}
let QINFO=buildQ(vatYear);
function findV(code,y){y=y==null?vatYear:y;return vats.find(x=>x.quarter_code===code&&String(x.year||'2026')===String(y));}
function lastDay(ym){const [y,m]=ym.split('-').map(Number);return ym+'-'+String(new Date(y,m,0).getDate()).padStart(2,'0');}
function setVatYear(y){vatYear=Number(y);QINFO=buildQ(vatYear);selQ=null;document.getElementById('detailCard').style.display='none';renderQuarters();}

function wf(n){return comma(n)+'원';}
let pendingAuth=null;
async function loadAll(){
  try{
    const [vtR,rvR,csR,plR,prR,fxR]=await Promise.all([
      fetchSheet(...R.S13),fetchSheet(...R.S04),
      fetchSheet(...R.S05),fetchSheet(...R.S01),fetchSheet(...R.S03),
      fetchSheetSafe(...R.S06).catch(()=>null)]); // v2.9.22: 기타경비(고정비) 세금계산서 매입세액 반영
    vats=dedupe(toObj(vtR).filter(v=>v.vat_id),'vat_id');
    const pls=toObj(plR),prjs=toObj(prR);
    // 재무 필터
    const okPl=new Set(pls.filter(p=>['수주','계약','종료'].includes(p.status)).map(p=>p.pipeline_id));
    const okPrj=new Set(prjs.filter(p=>okPl.has(p.pipeline_id)).map(p=>p.project_id));
    prjs.forEach(p=>prjMap[p.project_id]=p.project_name);
    revs=toObj(rvR).filter(r=>r.revenue_id&&okPrj.has(r.project_id));
    costs=toObj(csR).filter(c=>c.cost_id&&okPrj.has(c.project_id));
    fixedTax=toObj(fxR||[]).filter(f=>f.fixed_id&&f.has_tax_invoice==='Y');
    renderQuarters();
  }catch(e){toast('로드 실패: '+e.message,true);}
}
// v2.9.27: vat_amt가 명시적으로 0인 경우(계산서 없음, 사업소득형·급여형 매입)를 "값 없음"으로 오인해
// amount*10%로 폴백 계산하던 결함 수정 — 이 폴백은 vat_amt 필드 자체가 비어있을 때만 적용해야 한다.
// (구 코드 `num(r.vat_amt)||...`는 0이 falsy라 항상 폴백을 태워, 계산서 없는 매입에도 부가세가 잡히는
// 심각한 오류로 이어질 뻔했다 — 지급형태 3종 도입의 핵심 목적을 무력화하는 지점이었음.)
function vatOf(r,base){
  const raw=(r.vat_amt??'').toString().trim();
  if(raw!=='') return num(r.vat_amt);
  return Math.round((parseInt(r[base])||0)*.1);
}
// ── v3.8.0 부가세 신고 방식(신고/고지)·신고서 숫자 반영 (설계서 vat-declaration-design-v0.1) ─────────
const QORD=['1P','1F','2P','2F'];
function hasVal(x){return String(x??'').trim()!=='';}
function isLocked(v){return !!v&&v.status==='납부완료';}
// 예정 분기의 신고 방식. 확정 분기는 항상 직접 신고. 비어 있으면 「신고」(구 행 호환)
function ftOf(code,y){ if(code[1]!=='P') return '신고'; const v=findV(code,y); return v&&v.filing_type==='고지'?'고지':'신고'; }
// 분기 자체의 매출·매입(S04·S05·고정비) 집계 — 기존 계산 그대로
function baseQ(code,y){
  const q=buildQ(y)[code];
  const sRows=revs.filter(r=>q.months.includes(r.year_month));
  const pRows=costs.filter(c=>q.months.includes(c.year_month));
  // v2.9.22: 프로젝트 매입(S05)에 안 걸리는 기타경비(임대료·통신비 등) 중 세금계산서 수취분을 매입세액에 합산.
  const fxRows=(fixedTax||[]).filter(f=>q.months.includes(f.year_month));
  const sVat=sRows.reduce((s,r)=>s+vatOf(r,'tax_invoice_amt'),0);
  const pVatPrj=pRows.reduce((s,c)=>s+vatOf(c,'amount'),0);
  const pVatFx=fxRows.reduce((s,f)=>s+(num(f.vat_amt)||0),0);
  return {sVat,pVat:pVatPrj+pVatFx,pVatPrj,pVatFx,sRows,pRows,fxRows};
}
// 그 밖의 공제매입세액(카드·현금영수증 등): 입력값 우선, 없으면 직전 분기 입력값으로 예상(납부완료 분기는 예상 안 함)
function otherOf(code,y){
  const v=findV(code,y);
  if(v&&hasVal(v.other_deduct_vat)) return {val:num(v.other_deduct_vat),est:false};
  if(isLocked(v)) return {val:0,est:false};
  let i=QORD.indexOf(code),yy=y;
  for(let k=0;k<4;k++){ i--; if(i<0){i=3;yy--;} const pv=findV(QORD[i],yy);
    if(pv&&hasVal(pv.other_deduct_vat)&&num(pv.other_deduct_vat)>0) return {val:num(pv.other_deduct_vat),est:true}; }
  return {val:0,est:false};
}
// 신고서 기준 분기 세액(매출−매입−카드 등). 납부완료 분기는 신고 시점 저장값 사용
function effQ(code,y){
  const v=findV(code,y),b=baseQ(code,y),o=otherOf(code,y),locked=isLocked(v);
  const s=locked?(num(v.sales_vat)||0):b.sVat, p=locked?(num(v.purchase_vat)||0):b.pVat;
  return {b,o,locked,s,p,net:s-p-o.val};
}
// 예정고지 예상액: 직전 반기 세액 합계의 1/2, 천원 미만 버림, 50만원 미만이면 소액부징수 0. 실제 고지액은 납부 입력으로 덮어쓴다
function noticeEst(code,y){
  const h=code[0];
  const a=h==='1'?effQ('2P',y-1):effQ('1P',y), c=h==='1'?effQ('2F',y-1):effQ('1F',y);
  const t=a.net+c.net; if(t<=0) return 0;
  const e=Math.floor(t/2/1000)*1000; return e<500000?0:e;
}
function calcQ(code,y){
  y=y==null?vatYear:y;
  const e=effQ(code,y),b=e.b,o=e.o,v=findV(code,y)||{};
  const isP=code[1]==='P',ft=ftOf(code,y);
  let net=e.net,deduct=0,deductNote='',scope='분기',notice=0,pay=0,refund=0,carryAuto=0;
  if(isP){
    if(ft==='고지'){ notice=noticeEst(code,y); pay=notice; scope='고지'; }
    else { pay=Math.max(0,net); refund=Math.max(0,-net); }
  }else{
    const pc=code[0]+'P',pft=ftOf(pc,y),pe=effQ(pc,y),pv=findV(pc,y)||{};
    if(pft==='고지'){
      scope='반기'; net=pe.net+e.net;
      carryAuto=(isLocked(pv)&&num(pv.actual_payment))?num(pv.actual_payment):noticeEst(pc,y);
      deductNote='예정고지 기납부';
    }else{
      carryAuto=Math.max(0,-pe.net); deductNote='예정신고 미환급';
    }
    deduct=hasVal(v.carry_offset)?num(v.carry_offset):carryAuto;
    const r=net-deduct; pay=Math.max(0,r); refund=Math.max(0,-r);
  }
  return {sVat:b.sVat,pVat:b.pVat,pVatPrj:b.pVatPrj,pVatFx:b.pVatFx,sRows:b.sRows,pRows:b.pRows,fxRows:b.fxRows,
    other:o.val,otherEst:o.est,net,deduct,deductNote,scope,ft,notice,pay,refund,carryAuto};
}
function renderQuarters(){
  const ys=document.getElementById('vatYearSel');
  if(ys){const cur=Number(kstToday().slice(0,4));let o='';for(let y=2026;y<=Math.max(cur+1,vatYear);y++)o+=`<option value="${y}"${y===vatYear?' selected':''}>${y}</option>`;ys.innerHTML=o;}
  document.getElementById('qList').innerHTML=Object.entries(QINFO).map(([code,q])=>{
    const c=calcQ(code);
    const v=findV(code)||{};
    // v2.9.21: "납부완료" 분기는 실제 신고·납부에 쓰인 확정값(v.sales_vat 등, S13 저장분)을 그대로 표시하고
    // 이후 매출·매입 스케줄이 바뀌어 실시간 재계산값(c.sVat 등)과 달라지면 경고를 띄운다.
    // 부가세는 실제로 세무서에 신고·납부하는 금액이라, 확정 후 화면 숫자가 조용히 바뀌어 보이면
    // 신고 오류로 오인하거나 실제 오류를 놓칠 위험이 있어 자금수지보다 엄격하게 잠근다.
    const locked=v.status==='납부완료';
    const dSVat=locked?(num(v.sales_vat)||0):c.sVat, dPVatInv=locked?(num(v.purchase_vat)||0):c.pVat, dPVat=dPVatInv+c.other;
    // v2.9.70: 납부완료 분기는 "실납부액"과 "시스템 예상액(estimated_payment, 신고 시점 스냅샷)"을
    // 같이 보여준다 — 차이는 시스템에 등록되지 않은 세금계산서분을 가늠하는 지표.
    const dPay=locked?(num(v.actual_payment)||num(v.estimated_payment)||0):c.pay;
    const dEst=locked?(num(v.estimated_payment)||0):0;
    const dDiffAmt=locked&&dEst?dPay-dEst:0;
    const decl=hasVal(v.declared_tax)?num(v.declared_tax):null;
    const declLine=decl!==null?`<div style="font-size:10px;color:var(--text3);margin-top:2px">신고서 최종 ${decl<0?'환급 '+wf(-decl):'납부세액 '+wf(decl)}</div>`:'';
    const ftBadge=q.name.includes('예정')&&c.ft==='고지'?' <span style="font-size:10px;font-weight:600;color:#B45309;background:#FEF3C7;border-radius:6px;padding:1px 6px">예정고지</span>':'';
    const diffLine=locked&&dEst?`<div style="font-size:10px;color:var(--text3);margin-top:2px">시스템 예상 ${wf(dEst)} · 차이 <b style="color:${dDiffAmt===0?'var(--text3)':'#B45309'}">${dDiffAmt>0?'+':''}${wf(dDiffAmt)}</b></div>`+declLine:declLine;
    const changed=locked&&(dSVat!==c.sVat||dPVatInv!==c.pVat);
    const scopeLine=!locked&&code[1]==='F'&&c.scope==='반기'?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${code[0]==='1'?'1~6월':'7~12월'} 합산 세액 ${wf(c.net)} − 고지 기납부 ${wf(c.deduct)}</div>`:(!locked&&code[1]==='F'&&c.deduct?`<div style="font-size:10px;color:var(--text3);margin-top:2px">${c.deductNote} ${wf(c.deduct)} 차감</div>`:'');
    const st=v.status==='납부완료'?'b-done':(c.sVat||c.pVat)?'b-wait':'b-calc';
    const stTxt=v.status==='납부완료'?'납부완료':(c.sVat||c.pVat)?'납부예정':'집계중';
    return `<div class="q-card ${selQ===code?'sel':''}" onclick="selectQ('${code}')">
      <div class="q-head"><span class="q-name">${q.name} <span style="font-weight:400;font-size:11px;color:var(--text3)">(${q.months[0].slice(5)}~${q.months[2].slice(5)}월)</span>${ftBadge}</span>
        <span class="badge ${st}">${stTxt}</span></div>
      <div class="q-nums">
        <div><div class="lbl">매출 부가세${locked?' (신고 확정)':''}</div><div class="val">${wf(dSVat)}</div></div>
        <div><div class="lbl">매입 부가세${locked?' (신고 확정)':''}</div><div class="val">${wf(dPVat)}</div>${!locked&&(c.pVatFx||c.other)?`<div style="font-size:10px;color:var(--text3);margin-top:2px">프로젝트 ${wf(c.pVatPrj)} + 기타경비 ${wf(c.pVatFx)}${c.other?` + 카드 등 ${wf(c.other)}${c.otherEst?'(직전 분기 기준 예상)':''}`:''}</div>`:(locked&&c.other?`<div style="font-size:10px;color:var(--text3);margin-top:2px">세금계산서 ${wf(dPVatInv)} + 카드 등 ${wf(c.other)}</div>`:'')}</div>
        <div><div class="lbl">${locked?'실납부액':'납부 예정액'}</div><div class="val pay">${!locked&&!c.pay&&c.refund?`<span style="color:#059669">환급 ${wf(c.refund)}</span>`:wf(dPay)}</div>${scopeLine}${diffLine}</div>
      </div>
      <div class="q-due" style="margin-top:8px">신고·납부 기한 ${q.due}${v.paid_date?' · 납부일 '+v.paid_date:''}${v.cashflow_reflected==='Y'?' · 자금수지 반영 ✓':''}</div>
      ${changed?`<div style="margin-top:8px;padding:8px 10px;background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;font-size:11px;color:#991B1B">⚠ 신고 이후 이 분기의 매출·매입 내역이 변경되었습니다(현재 기준 재계산 시 매출 ${wf(c.sVat)}·매입 ${wf(c.pVat)}). 실제 신고 내용과 다른 경우 수정신고 필요 여부를 확인하세요.</div>`:''}
    </div>`;}).join('');
}
function selectQ(code){
  selQ=code;renderQuarters();
  const q=QINFO[code],c=calcQ(code);
  document.getElementById('detailCard').style.display='block';
  document.getElementById('detailTitle').textContent=`${q.name} 상세 (${q.months[0]} ~ ${q.months[2]})`;
  const vv=findV(code)||{};
  const lockedD=vv.status==='납부완료';
  const estD=lockedD?(num(vv.estimated_payment)||c.pay):c.pay;
  const actD=lockedD?(num(vv.actual_payment)||0):0;
  const oTxt=c.other?` − 카드 등 공제매입 ${wf(c.other)}${c.otherEst?'(직전 분기 기준 예상)':''}`:'';
  let f;
  if(lockedD){
    f=`시스템 예상 납부액 = 매출 VAT ${wf(num(vv.sales_vat))} − 매입 VAT ${wf(num(vv.purchase_vat))} = <b>${wf(estD)}</b>`
     +(actD?`<br>실납부액 <b>${wf(actD)}</b> · 차이 <b>${actD-estD>0?'+':''}${wf(actD-estD)}</b> (카드 등 공제매입·예정 환급·미등록 세금계산서분 등)`:'');
  }else if(code[1]==='P'&&c.ft==='고지'){
    f=`예정고지 예상액 = 직전 반기 세액 합계 ÷ 2 (천원 미만 버림) = <b>${wf(c.notice)}</b><br><span style="color:var(--text3)">이 분기 실적 세액(참고): 매출 ${wf(c.sVat)} − 매입 ${wf(c.pVat)}${oTxt} = ${wf(c.net)}. 실제 고지서 금액은 아래 [실납부액]에 입력하세요.</span>`;
  }else if(code[1]==='F'){
    f=`${c.scope==='반기'?(code[0]==='1'?'1~6월':'7~12월')+' 합산 ':''}세액 = 매출 VAT − 매입 VAT${c.other?' − 카드 등 공제매입':''} = ${wf(c.net)}`
     +(c.deduct?`<br>${c.deductNote} ${wf(c.deduct)} 차감`:'')+`<br>시스템 예상 납부액 = <b>${c.pay?wf(c.pay):(c.refund?'환급 '+wf(c.refund):wf(0))}</b>`;
  }else{
    f=`시스템 예상 납부액 = 매출 VAT ${wf(c.sVat)} − 매입 VAT ${wf(c.pVat)}${oTxt} = <b>${c.pay?wf(c.pay):(c.refund?'환급 '+wf(c.refund):wf(0))}</b>`;
  }
  document.getElementById('payFormula').innerHTML=f
    +`<br>자금수지 추정에는 <b>시스템 예상액</b>이 ${q.payYm} 현금 유출로 반영됩니다. 실제 납부액은 통장 CSV의 세금 출금으로 확인합니다.`;
  // 신고서 입력 칸 채우기
  const isP=code[1]==='P';
  document.getElementById('dFilingWrap').style.display=isP?'':'none';
  document.getElementById('dCarryWrap').style.display=isP?'none':'';
  document.getElementById('dFiling').value=c.ft;
  document.getElementById('dOther').value=hasVal(vv.other_deduct_vat)?comma(vv.other_deduct_vat):'';
  document.getElementById('dOther').placeholder=c.otherEst?'비움 = 직전 분기 기준 예상 '+comma(c.other):'비움 = 0원(미입력)';
  document.getElementById('dCarry').value=hasVal(vv.carry_offset)?comma(vv.carry_offset):'';
  document.getElementById('dCarry').placeholder='비움 = 자동 '+comma(c.carryAuto)+(c.deductNote?' ('+c.deductNote+')':'');
  document.getElementById('dDeclared').value=hasVal(vv.declared_tax)?(num(vv.declared_tax)<0?'-':'')+comma(Math.abs(num(vv.declared_tax))):'';
  const sT=document.getElementById('salesTable');
  sT.innerHTML='<tr><th>월 / 프로젝트</th><th>공급가액</th><th>부가세</th></tr>'+
    (c.sRows.length?c.sRows.map(r=>`<tr><td>${r.year_month.slice(5)}월 ${prjMap[r.project_id]||r.project_id}</td><td>${wf(r.tax_invoice_amt)}</td><td>${wf(vatOf(r,'tax_invoice_amt'))}</td></tr>`).join('')
      +`<tr class="sum"><td>소계</td><td></td><td>${wf(c.sVat)}</td></tr>`
    :'<tr><td colspan="3" style="text-align:center;color:var(--text3)">내역 없음</td></tr>');
  const pT=document.getElementById('purchaseTable');
  pT.innerHTML='<tr><th>월 / 프로젝트</th><th>공급가액</th><th>부가세</th></tr>'+
    (c.pRows.length?c.pRows.map(r=>`<tr><td>${r.year_month.slice(5)}월 ${prjMap[r.project_id]||r.project_id}</td><td>${wf(r.amount)}</td><td>${wf(vatOf(r,'amount'))}</td></tr>`).join('')
      +`<tr class="sum"><td>소계</td><td></td><td>${wf(c.pVat)}</td></tr>`
    :'<tr><td colspan="3" style="text-align:center;color:var(--text3)">내역 없음</td></tr>');
  const v=findV(code)||{};
  document.getElementById('actualPay').value=v.actual_payment?comma(v.actual_payment):comma(c.pay);
  document.getElementById('paidDate').value=v.paid_date||'';
  document.getElementById('detailCard').scrollIntoView({behavior:'smooth'});
}
const H13=['vat_id','year','quarter_code','period_start','period_end','due_date','sales_vat','purchase_vat','estimated_payment','actual_payment','paid_date','cashflow_reflected','status','memo','filing_type','other_deduct_vat','carry_offset','declared_tax']; // v3.8.0: O~R
async function saveS13(){
  vats=dedupe(vats,'vat_id'); // PK 무결성 규칙
  const rows=rowsFor(H13,vats);
  return await clearAndWrite(...W.S13,[H13,...rows]);
}
function upsertVat(code,patch){
  const q=QINFO[code];const c=calcQ(code);
  let v=findV(code);
  if(!v){v={vat_id:`VAT-${vatYear}-${code}`,year:String(vatYear),quarter_code:code,
    period_start:q.months[0]+'-01',period_end:lastDay(q.months[2]),due_date:q.due,
    cashflow_reflected:'N',status:'집계중',memo:q.name};vats.push(v);}
  // v2.9.70: 이미 납부완료로 확정된 분기는 신고 시점 스냅샷(sales_vat·purchase_vat·estimated_payment)을
  // 다시 쓰지 않는다 — 이전엔 [자금수지 반영] 등이 호출될 때마다 현재 재계산값/입력한 실납부액으로
  // 덮어써 "시스템 예상액"이 사라졌다.
  if(!(v.status==='납부완료'&&num(v.estimated_payment))){v.sales_vat=c.sVat;v.purchase_vat=c.pVat;v.estimated_payment=c.pay;}
  Object.assign(v,patch);return v;
}
function fmtSigned(el){const neg=/^\s*-/.test(el.value);const d=el.value.replace(/[^0-9]/g,'');el.value=d?(neg?'-':'')+Number(d).toLocaleString():(neg?'-':'');}
async function saveDecl(){
  if(!selQ){toast('분기를 선택하세요',true);return;}
  const g=id=>document.getElementById(id).value.trim();
  const sv=t=>t===''||t==='-'?'':(t.startsWith('-')?-1:1)*un(t.replace('-',''));
  const patch={other_deduct_vat:g('dOther')===''?'':un(g('dOther')),declared_tax:sv(g('dDeclared'))};
  if(selQ[1]==='P') patch.filing_type=document.getElementById('dFiling').value;
  else patch.carry_offset=g('dCarry')===''?'':un(g('dCarry'));
  const btn=document.getElementById('btnSaveDecl');btn.disabled=true;
  // 저장 실패 시 화면의 로컬 상태를 되돌린다(저장 성공 시에만 반영)
  const had=findV(selQ),copy=had?{...had}:null,len=vats.length;
  upsertVat(selQ,patch);
  const ok=await saveS13();btn.disabled=false;
  if(ok){toast('✓ 신고서 입력 저장 완료');const k=selQ;renderQuarters();selectQ(k);}
  else{ if(copy){Object.keys(had).forEach(k=>delete had[k]);Object.assign(had,copy);}else vats.length=len; toast('저장 실패',true); }
}
async function savePayment(){
  if(!selQ){toast('분기를 선택하세요',true);return;}
  const pay=un(document.getElementById('actualPay').value);
  const date=document.getElementById('paidDate').value;
  if(!pay||!date){toast('실납부액과 납부일을 입력하세요',true);return;}
  const btn=document.getElementById('btnSavePay');btn.disabled=true;
  upsertVat(selQ,{actual_payment:pay,paid_date:date,status:'납부완료'});
  const ok=await saveS13();btn.disabled=false;
  if(ok){toast('✓ 실납부 저장 완료');renderQuarters();}else toast('저장 실패',true);
}
async function reflectCashflow(){
  if(!selQ){toast('분기를 선택하세요',true);return;}
  const q=QINFO[selQ],c=calcQ(selQ);
  const v=findV(selQ);
  // v2.9.70: 자금수지 "추정"에는 실납부액이 아니라 시스템 예상액을 반영한다(추정=계획, 실제는 통장 CSV).
  const amt=(v&&v.status==='납부완료'&&num(v.estimated_payment))?num(v.estimated_payment):c.pay;
  if(!amt){toast('시스템 예상 납부액이 0원입니다',true);return;}
  if(!confirm(`${q.payYm}월(신고·납부 기한 월) 자금수지 추정 유출에 시스템 예상액 ${wf(amt)}을 반영합니다.\n(실제 납부액은 통장 CSV의 세금 출금으로 확인됩니다)\n확정 후 자금수지의 [추정 재계산]이 실행되어야 추정 잔액에 반영됩니다.`))return;
  const btn=document.getElementById('btnReflect');btn.disabled=true;
  try{
    // v2.6: 추정 산출자는 자금수지 recalc 하나(SSOT) — 여기서는 S13에 반영 확정만 기록.
    // recalc는 S13의 납부기한 월에 실납부액(없으면 추정세액)을 유출로 집계한다.
    upsertVat(selQ,{cashflow_reflected:'Y'});
    const ok=await saveS13();
    btn.disabled=false;
    if(ok){
      toast(`✓ ${selQ} 반영 확정 (${q.payYm} 유출 ${wf(amt)})`);renderQuarters();
      if(confirm('자금수지 화면으로 이동해 [추정 재계산]을 바로 실행할까요?')) location.href='cashflow.html?recalc=1';
    }
  }catch(e){btn.disabled=false;toast('반영 실패: '+e.message,true);}
}
